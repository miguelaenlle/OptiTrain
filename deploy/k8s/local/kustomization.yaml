apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# k3d on a laptop: small CPU model, no GPU, images loaded straight into the
# cluster (`k3d image import`) so there is no registry to push to.
resources:
  - ../base
images:
  - name: fleet-router
    newTag: dev
  - name: fleet-worker
    newTag: dev
patches:
  - target: { kind: Deployment, name: fleet-worker }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 3Gi
